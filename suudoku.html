<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>数独</title>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="./suudoku.js"></script>
        <link rel="stylesheet" href="./suudoku.css" />
        <style>
            body { text-align: center; background: white; }
            canvas { background:black; border: 2px solid #333; margin-top: 20px; }
        </style>
    </head>
    <body>
        <div class="all-button">
            <div class="difficulty-menu">
            <button id="easy">初級</button>
            <button id="normal">中級</button>
            <button id="hard">上級</button>
            <button id="answer">答え</button>
            </div>
            <label id="message">レベルを選択してください</label>
            <canvas id="gameCanvas" width="450" height="450"></canvas>
            <div class="controls">
            <table class="d-pad">
                <tr>
                    <td></td>
                    <td><button id="up">↑</button></td>
                    <td></td>
                </tr>
                <tr>
                    <td><button id="left">←</button></td>
                    <td></td>
                    <td><button id="right">→</button></td>
                </tr>
                <tr>
                    <td></td>
                    <td><button id="down">↓</button></td>
                    <td></td>
                </tr>
            </table>
            <table class="num-pad">
                <tr>
                    <td><button id="seven">７</button></td>
                    <td><button id="eight">８</button></td>
                    <td><button id="nine">９</button></td>
                </tr>
                <tr>
                    <td><button id="four">４</button></td>
                    <td><button id="five">５</button></td>
                    <td><button id="six">６</button></td>
                </tr>
                <tr>
                    <td><button id="one">１</button></td>
                    <td><button id="two">２</button></td>
                    <td><button id="three">３</button></td>
                </tr>
                <tr>
                    <td><button id="zero">０</button></td>
                </tr>
            </table>
            </div>
        </div>
    </body>
</html>
